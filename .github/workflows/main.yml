name: Test and build GNOME extension

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gettext gnome-shell

      - name: Build extension from scratch
        run: |
          make clean || true
          make build > build.log 2>&1


      - name: Upload build log (always)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload built extension (only on main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: input-toggle-${{ github.ref_name }}-${{ github.run_number }}
          path: input-toggle@ntako.com.zip
